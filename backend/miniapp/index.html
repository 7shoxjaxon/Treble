.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 0;padding:0 20px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--fub);color:var(--fu);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.no{background:var(--nob);color:var(--no)}.pill.ac{background:var(--acd);color:var(--ac)}
.seg{display:flex;padding:4px;border-radius:99px;background:var(--s1);border:1px solid var(--ol);margin-top:14px}
.seg div{flex:1;text-align:center;padding:10px 6px;border-radius:99px;font-weight:700;font-size:14px;color:var(--mu);position:relative}
.seg div.on{background:var(--acd);color:var(--ac);box-shadow:inset 0 0 0 1px rgba(79,227,255,.4)}
.dot{position:absolute;top:6px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--ac)}
/* qidiruv */
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 18px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04)),rgba(10,16,23,.6);margin-top:16px}
.search input{flex:1;background:none;border:0;font-size:16px;min-width:0}.search input::placeholder{color:var(--mu)}
.fld{width:100%;height:54px;padding:0 16px;border-radius:16px;background:var(--s2);border:1px solid var(--ol);font-size:16px}
.fld:focus{border-color:rgba(79,227,255,.6)}.fld[readonly]{opacity:.7}
textarea.fld{height:auto;padding:12px 16px}
.lbl{color:var(--mu);font-size:12px;font-weight:600;margin:14px 0 6px}
/* sarlavha */
.hd{display:flex;align-items:center;gap:12px}
.bell{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05))}
.bell i{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--ac);color:var(--dk);font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sec{display:flex;align-items:center;margin:22px 0 2px}.sec b{flex:1;font-size:21px;font-weight:800;font-style:italic}.sec span{color:var(--ac);font-weight:700}

.feat{position:relative;border-radius:30px;overflow:hidden;border:1px solid var(--gb);min-height:300px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:linear-gradient(160deg,#0f3a5c,#0a1a2c)}
.feat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.feat .ball{position:absolute;z-index:0;left:50%;top:38%;transform:translate(-50%,-50%);opacity:.35}

.go{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--acs),var(--ac2))}
.rowc{display:flex;align-items:center;gap:14px;padding:12px;border-radius:26px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(10,16,23,.55);margin-top:12px}
.dblk{width:72px;flex:none;text-align:center;padding:10px 4px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05)}

.nextg{display:flex;align-items:center;gap:12px;border-radius:24px;padding:14px 16px;border:1px solid rgba(79,227,255,.35);background:linear-gradient(135deg,rgba(79,227,255,.18),rgba(79,227,255,.04)),rgba(10,16,23,.6);margin-top:16px}
.venimg{width:100%;height:120px;object-fit:cover;border-radius:16px;margin-bottom:12px;background:var(--s2)}
.thumb{width:68px;height:68px;border-radius:14px;object-fit:cover;background:var(--s2);flex:none;display:flex;align-items:center;justify-content:center}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--ac);font-weight:800;overflow:hidden;border:1px solid var(--ol)}

#ov{position:fixed;inset:0;z-index:30;display:none;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}

#ov>.in{position:relative;padding:calc(var(--top) + var(--ctop) + 10px) 20px calc(140px + var(--bot))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.top h1{font-size:22px;flex:1}
.rb{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05))}
.hero{position:relative;margin:0 -20px 14px;height:260px;background:linear-gradient(160deg,#0f3a5c,#0a1a2c);overflow:hidden}

const TZ=5*36e5,DAY=864e5,p2=n=>String(n).padStart(2,'0');
const DAYS=['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'],MON=['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
const MONF=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const sod=ms=>Math.floor((ms+TZ)/DAY)*DAY-TZ,today=()=>sod(Date.now()),part=ms=>new Date(ms+TZ);
const wd=ms=>DAYS[part(ms).getUTCDay()],dom=ms=>part(ms).getUTCDate(),mon=ms=>MON[part(ms).getUTCMonth()];
function dayLabel(ms){const d=sod(ms),t=today();return `${d==t?'Bugun':d==t+DAY?'Ertaga':wd(d)}, ${dom(d)} ${mon(d)}`}
const chipLabel=ms=>{const d=sod(ms);return `${d==today()?'Bugun':wd(d)}, ${dom(d)} ${mon(d)}`};
const dateWD=ms=>{const d=sod(ms);return `${wd(d)}, ${dom(d)} ${mon(d)}`};
const monthKey=ms=>{const d=part(ms);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)};
const monthLabel=k=>{const [y,m]=String(k).split('-');return (MONF[+m-1]||'')+' '+y};
const hm=ms=>{const d=part(ms);return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const ymdhms=ms=>{const d=part(ms);return d.getUTCFullYear()+p2(d.getUTCMonth()+1)+p2(d.getUTCDate())+'T'+p2(d.getUTCHours())+p2(d.getUTCMinutes())+'00'};
const fmtP=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const price=g=>g.price?fmtP(g.price)+" so'm":'Bepul';
const startMs=g=>{const [h,m]=g.startTime.split(':').map(Number);return sod(g.dateMillis)+(h*60+m)*6e4};
const endMs=g=>startMs(g)+g.durationMin*6e4;
const over=g=>g.isFinished||Date.now()>endMs(g);
const left=g=>Math.max(0,g.maxPlayers-g.players.length);
const joined=g=>g.players.some(p=>p.id===ME.id);
const gstat=g=>g.isCancelled?'C':over(g)?'F':g.players.length>=g.maxPlayers?'U':'O';
const SL={O:'Joy bor',U:"To'lgan",F:'Yakunlangan',C:'Bekor qilingan'},SC={O:'ok',U:'',F:'',C:'no'};
const range=g=>g.startTime+'–'+hm(startMs(g)+g.durationMin*6e4);
function cd(ms){const l=ms-Date.now();if(l<=0)return "O'yin boshlandi";const m=Math.floor(l/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d>0?`${d} kun ${h} soat`:h>0?`${h} soat ${m%60} daqiqa`:`${m} daqiqa`}

 try{const r=await api('GET','/chat/members'),m=r.members||[];const el=$('#mem');if(el)el.innerHTML=m.length?m.map(x=>`<div class="pl" onclick="closeShade();openDm('${x.id}')">${av(x.avatar,x.name,40)}<span class="sp ell b">${esc(x.name)}</span></div>`).join(''):`<div class="mu" style="padding:14px 0">Hozircha chatda boshqa a'zolar yo'q.</div>`}catch(e){const el=$('#mem');if(el)el.innerHTML=`<div class="c" style="padding:24px">${esc(e.message)}</div>`}}
function openDm(id){push({t:'dm',id})}
function dmHtml(it){return `<div class="in"><div class="top">${backBtn}<div id="dmh" class="row sp"><span class="spin"></span></div></div><div id="dmsg" class="msgs"></div><div id="dmn"></div></div><div class="cbar ovb"><div class="comp"><input id="di" maxlength="1000" placeholder="Xabar yozing..." onkeydown="if(event.key==='Enter')sendDm()"><button class="sendb" id="dsb" onclick="sendDm()">${ic('Send',22,'#021821')}</button></div></div>`}
function drawDm(){const h=$('#dmh');if(!h)return;if(DM.peer)h.innerHTML=`${av(DM.peer.avatar,DM.peer.name,40)}<b class="ell" style="font-size:18px">${esc(DM.peer.name)}</b>`;
 const nb=window.innerHeight+($('#ov').scrollTop)>=$('#ov').scrollHeight-180,m=$('#dmsg');
 if(m)m.innerHTML=DM.msgs.length?DM.msgs.map(bub).join(''):(DM.loaded?`<div class="empty"><p>Hali xabar yo'q. Birinchi bo'lib yozing!</p></div>`:'');
 const n=$('#dmn');if(n)n.innerHTML=DM.inChat?'':`<div class="card item mu sm" style="text-align:center">Bu foydalanuvchi chatdan chiqqan. Hozircha unga xabar yubora olmaysiz.</div>`;
 const i=$('#di'),b=$('#dsb');if(i)i.disabled=!DM.inChat;if(b)b.disabled=!DM.inChat;
 if(nb||!DM.last)$('#ov').scrollTop=$('#ov').scrollHeight}
async function startDm(){const it=STACK[STACK.length-1];if(!it||it.t!='dm')return;DM={id:it.id,peer:null,inChat:true,msgs:[],last:0,loaded:false};
 try{const r=await api('GET','/chat/dm/'+it.id);DM.peer=r.peer;DM.inChat=r.peerInChat!==false;DM.msgs=r.messages||[];DM.last=DM.msgs.reduce((a,m)=>Math.max(a,m.createdAt),0);DM.loaded=true;drawDm();$('#ov').scrollTop=$('#ov').scrollHeight}catch(e){toast(e.message);pop();return}
 clearInterval(dmTimer);dmTimer=setInterval(async()=>{const t=STACK[STACK.length-1];if(!t||t.t!='dm')return;try{const r=await api('GET','/chat/dm/'+t.id+'?after='+DM.last);DM.inChat=r.peerInChat!==false;const nw=(r.messages||[]).filter(m=>!DM.msgs.some(x=>x.id==m.id));if(nw.length){DM.msgs=DM.msgs.concat(nw);DM.last=Math.max(DM.last,...nw.map(m=>m.createdAt))}if(nw.length||!DM.inChat)drawDm()}catch(e){}},4000)}
async function sendDm(){const i=$('#di'),v=(i.value||'').trim();if(!v||!DM.id)return;i.value='';try{const r=await api('POST','/chat/dm/'+DM.id,{text:v});if(!DM.msgs.some(x=>x.id==r.message.id))DM.msgs.push(r.message);DM.last=Math.max(DM.last,r.message.createdAt);drawDm();$('#ov').scrollTop=$('#ov').scrollHeight}catch(e){i.value=v;toast(e.message)}}

/* ---------- STATISTIKA, REYTING ---------- */
function stats(mk){const m=new Map();G.forEach(g=>{if(g.isCancelled)return;if(mk&&monthKey(g.dateMillis)!=mk)return;const ov=over(g);
 g.players.forEach(p=>{if(String(p.id).startsWith('guest-'))return;const pl=ov&&p.attended!==false?1:0,ms=p.attended===false?1:0,o=m.get(p.id);
  if(!o)m.set(p.id,{id:p.id,name:p.name,avatar:p.avatar,signed:1,played:pl,missed:ms});else{o.name=p.name;o.avatar=o.avatar||p.avatar;o.signed++;o.played+=pl;o.missed+=ms}})});
 return [...m.values()].sort((a,b)=>b.played-a.played||b.signed-a.signed||a.name.toLowerCase().localeCompare(b.name.toLowerCase()))}
const ranking=mk=>stats(mk).filter(s=>s.played>0);

/* ---------- PROFIL ---------- */
const MENU=[['Edit',"Shaxsiy ma'lumotlar",'personal'],['Trophy','Reyting','rating'],['Ticket','Kuponlarim','coupons'],['Person','Profilim','public'],['Help','Savol-javob','faq'],['Phone',"Bog'lanish",'contact'],['Shield','Maxfiylik siyosati','privacy']];
function renderProfile(){
 $('#app').innerHTML=`<h1>Profil</h1><div class="glass item" style="text-align:center;margin-top:16px"><div style="display:flex;justify-content:center">${av(ME.avatar,ME.name,88)}</div><div class="b" style="font-size:20px;margin-top:10px">${esc(ME.name)}</div><div class="mu">${esc(ME.phone||'')}</div></div>`+
 MENU.map(([i,t,k])=>`<div class="mrow" onclick="openPage('${k}')"><div class="mi">${ic(i,22,'var(--ac)')}</div><b class="sp">${t}</b>${k=='coupons'?`<span class="pill ac">${CP.filter(c=>!c.usedGameId).length}</span>`:''}${ic('ChevronRight',22,'#8E9BAA')}</div>`).join('')}
function openPage(k){push({t:'page',k})}
let RT=0;
const pageT=(t,body)=>`<div class="in"><div class="top">${backBtn}<h1>${t}</h1></div>${body}</div>`;
function pageHtml(it){return ({personal:pPersonal,rating:pRating,coupons:pCoupons,public:pPublic,faq:pFaq,privacy:pPrivacy,contact:pContact})[it.k]()}
function pPersonal(){return pageT("Shaxsiy ma'lumotlar",`<div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin:10px 0 6px">${av(ME.avatar,ME.name,100)}<div class="row"><label class="btn2 sm2" style="width:auto;padding:0 18px">${ME.avatar?"Rasmni almashtirish":"Rasm qo'shish"}<input type="file" accept="image/*" hidden onchange="upAv(this)"></label>${ME.avatar?`<button class="btnr sm2" style="width:auto;padding:0 18px" onclick="delAv()">O'chirish</button>`:''}</div></div>
 <div class="lbl">To'liq ism</div><input class="fld" id="pn" maxlength="40" value="${esc(ME.name)}"><div class="lbl">Telefon raqami</div><input class="fld" readonly value="${esc(ME.phone||'Kiritilmagan')}"><div class="mu sm mt">Telefon raqamini bu yerda o'zgartirib bo'lmaydi.</div><div class="mt2"><button class="btn" id="psv" onclick="savePn()">Saqlash</button></div>`)}
async function savePn(){const v=($('#pn').value||'').trim();const b=$('#psv');b.disabled=true;b.textContent='Saqlanmoqda...';try{const r=await api('PUT','/me',{name:v});ME=r.user;hap();toast('Saqlandi');renderOv()}catch(e){b.disabled=false;b.textContent='Saqlash';toast(e.message)}}
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Rasm xato')),'image/jpeg',.85)};im.onerror=()=>no(new Error("Rasmni o'qib bo'lmadi"));im.src=URL.createObjectURL(f)})}
async function upAv(inp){const f=inp.files&&inp.files[0];if(!f)return;try{const blob=await shrink(f);const r=await fetch('/me/avatar',{method:'POST',headers:{Authorization:'Bearer '+T,'Content-Type':'image/jpeg'},body:blob});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'Rasm yuklanmadi');ME=j.user;hap();toast('Saqlandi');renderOv()}catch(e){toast(e.message)}}
async function delAv(){try{const r=await api('DELETE','/me/avatar');ME=r.user;renderOv()}catch(e){toast(e.message)}}
function pRating(){const mk=RT==0?monthKey(Date.now()):null,rk=ranking(mk),my=rk.findIndex(s=>s.id==ME.id);
 return pageT('Reyting',`<div class="seg"><div class="${RT==0?'on':''}" onclick="RT=0;renderOv()">Bu oy</div><div class="${RT==1?'on':''}" onclick="RT=1;renderOv()">Butun davr</div></div>
 <div class="card item row" style="align-items:flex-start">${ic('Info',18,'#8E9BAA')}<div class="mu sm" style="line-height:1.5">${RT==0?"Reyting shu oyda o'ynalgan o'yinlar soni bo'yicha tuziladi. Oy oxirida eng faol 3 o'yinchi bittadan bepul o'yin kuponini yutib oladi.":"Butun davr bo'yicha eng ko'p o'ynagan futbolchilar. Sovg'alar har oylik reytingda beriladi."}${RT==0?`<div class="ac b mt" style="margin-top:4px" onclick="openPage('coupons')">Kuponlar</div>`:''}</div></div>`+
 (rk.length?`<div class="card item row jb"><span class="mu">Sizning o'rningiz</span><b class="ac" style="font-size:18px">${my>=0?'#'+(my+1):"Hali o'ynamagansiz"}</b></div>`+rk.map((s,i)=>`<div class="rk ${s.id==ME.id?'me':''}"><span class="n ${i==0?'g':i==1?'s':i==2?'br':''}">${i+1}</span>${av(s.avatar,s.name,38)}<span class="sp ell b">${esc(s.name)}${s.id==ME.id?' (Siz)':''}</span><b class="ac">${s.played}</b><span class="mu sm">o'yin</span></div>`).join(''):empty('Trophy',"Reyting hali bo'sh","O'yinlar o'tgach, eng faol futbolchilar shu yerda ko'rinadi.")))}
function pCoupons(){return pageT('Kuponlarim',CP.length?CP.map(c=>`<div class="card item row"><div class="mi" style="width:46px;height:46px;border-radius:14px;background:var(--acd);display:flex;align-items:center;justify-content:center;flex:none">${ic('Ticket',24,'var(--ac)')}</div><div class="sp"><div class="b">Bepul o'yin kuponi</div><div class="mu sm">${monthLabel(c.monthKey)} reytingi uchun</div></div><span class="pill ${c.usedGameId?'':'ok'}">${c.usedGameId?'Ishlatilgan':'Faol'}</span></div>`).join(''):empty('Ticket',"Hozircha kuponlar yo'q","Oylik reyting top-3 sovg'alari shu yerda ko'rinadi.","Reytingga o'tish","STACK.pop();openPage('rating')"))}
function pPublic(){const st=stats(null).find(s=>s.id==ME.id),played=st?st.played:0,missed=st?st.missed:0,rk=ranking(null).findIndex(s=>s.id==ME.id);
 const last=G.filter(g=>joined(g)&&over(g)&&!g.isCancelled&&(g.players.find(p=>p.id==ME.id)||{}).attended!==false).sort((a,b)=>startMs(b)-startMs(a)).slice(0,10);
 return pageT('Profilim',`<div class="glass item" style="text-align:center"><div style="display:flex;justify-content:center">${av(ME.avatar,ME.name,88)}</div><div class="b" style="font-size:20px;margin-top:10px">${esc(ME.name)}</div><div class="mu sm">O'yinchi</div><div class="mu sm mt">${monthLabel(monthKey(ME.joinedAt||Date.now()))} dan Treble bilan birga!</div></div>
 <div class="stats"><div><b>${played}</b><span>O'ynagan o'yinlari</span></div><div><b>${played+missed>0?Math.round(played*100/(played+missed))+'%':'—'}</b><span>Davomat</span></div></div>
 <div class="card item row jb"><span class="mu sm b" style="letter-spacing:.5px">REYTINGDAGI O'RNINGIZ</span><b class="ac" style="font-size:20px">${rk>=0?'#'+(rk+1):'—'}</b></div>
 <div class="sec"><b style="font-size:18px">Oxirgi o'yinlar</b></div>`+(last.length?last.map(g=>`<div class="card item" onclick="openGame('${g.id}')"><div class="b">${esc(g.venueName)}</div><div class="mu sm">${dateWD(g.dateMillis)} · ${esc(g.format)} · ${g.players.length} o'yinchi</div></div>`).join(''):`<div class="mu" style="padding:10px 0">Hali o'yin o'ynalmagan.</div>`))}
const FAQ=[["O'yinga qanday yozilaman?","«O'yinlar» bo'limidan o'yinni tanlang, sahifasidagi «Band qilish» tugmasini bosing va to'lov usulini tasdiqlang."],["Bandni bekor qila olamanmi?","Ha. Har bir o'yin sahifasida bekor qilish muddati ko'rsatilgan (odatda o'yin boshlanishidan 24 soat oldin). Undan keyin bekor qilish uchun tashkilotchi bilan bog'laning."],["To'lov qanday amalga oshiriladi?","Odatda o'yin kuni maydonda to'lanadi. Tashkilotchi karta ma'lumotini kiritgan bo'lsa, kartaga o'tkazma ham tanlash mumkin. To'lovni tashkilotchi belgilab boradi."],["Kupon nima va qanday olinadi?","Har oy oxirida shu oyda eng ko'p o'ynagan 3 futbolchiga bittadan bepul o'yin kuponi beriladi. Band qilishda uni to'lov usuli sifatida tanlaysiz."],["Reyting qanday hisoblanadi?","Reyting o'tgan o'yinlar soniga qarab tuziladi. Tashkilotchi «Kelmadi» deb belgilagan o'yinlar hisobga olinmaydi."],["O'yin bekor qilinsa nima bo'ladi?","Tashkilotchi o'yinni bekor qilsa, u «Bekor qilingan» holatida ko'rinadi, kupon ishlatgan bo'lsangiz, u qaytariladi."]];
function pFaq(){return pageT('Savol-javob',FAQ.map(([q,a])=>`<div class="acc"><div onclick="this.parentNode.classList.toggle('open')"><span class="sp">${esc(q)}</span>${ic('ChevronRight',20,'#8E9BAA')}</div><div>${esc(a)}</div></div>`).join(''))}
const PRIV=[["Qanday ma'lumotlar saqlanadi","Ismingiz, telefon raqamingiz, logoningiz va parolingiz (faqat shifrlangan ko'rinishda), shuningdek band qilgan o'yinlaringiz va izohlaringiz."],["Ma'lumotlar qayerda saqlanadi","Ma'lumotlar Treble serverida saqlanadi va faqat ilova ishlashi uchun ishlatiladi. Uchinchi shaxslarga berilmaydi."],["Telefon raqamingizni kim ko'radi","Faqat o'yinlarni tashkil qiluvchi admin. Boshqa futbolchilar faqat ismingizni ko'radi."],["Ma'lumotlarni o'chirish","Profil bo'limidagi «Akkauntni o'chirish» orqali hisobingizni istalgan vaqtda o'chirishingiz mumkin."]];
function pPrivacy(){return pageT('Maxfiylik siyosati',PRIV.map(([t,x])=>`<div class="card item"><div class="b">${esc(t)}</div><div class="mu mt" style="line-height:1.5">${esc(x)}</div></div>`).join(''))}
function pContact(){const ph=(ST.supportPhone||'').trim(),tgu=(ST.supportTelegram||'').trim().replace(/^@/,'');
 return pageT("Bog'lanish",ph||tgu?`${ph?`<div class="card item"><div class="mu sm">Telefon raqami</div><div class="b mt" style="font-size:18px">${esc(ph)}</div><button class="btn sm2 mt" onclick="openLink('tel:${esc(ph.replace(/[^\d+]/g,''))}')">Qo'ng'iroq qilish</button></div>`:''}${tgu?`<div class="card item"><div class="mu sm">Telegram</div><div class="b mt" style="font-size:18px">@${esc(tgu)}</div><button class="btn2 sm2 mt" onclick="tg.openTelegramLink('https://t.me/${esc(tgu)}')">Telegram</button></div>`:''}`:empty('Phone',"Ma'lumot kiritilmagan","Tashkilotchi hali bog'lanish ma'lumotlarini qo'shmagan."))}

/* ---------- ISHGA TUSHIRISH ---------- */
async function refresh(){try{await load();await loadNotifs()}catch(e){return}
 if(STACK.length){const t=STACK[STACK.length-1],a=document.activeElement;if((t.t=='game'||t.t=='notifs')&&!(a&&a.tagName=='INPUT'))renderOv()}
 else{bgRefresh();if(tab=='games')bellUpd()}
 if(tab!='chat')chatStatus()}
(async()=>{try{
 if(!tg.initData){$('#app').innerHTML=`<div class="logo">${ball(76,'var(--ac)')}<b>TREBLE</b></div><div class="c" style="padding-top:10px">Bu sahifani Telegram bot orqali oching.</div>`;return}
 if(!(await auth())){$('#app').innerHTML=`<div class="logo">${ball(76,'var(--ac)')}<b>TREBLE</b></div><div class="c" style="padding-top:10px">Raqam ulashilmadi. Botga qaytib «/start» bosing va raqamni ulashing.</div>`;return}
 await Promise.all([load(),loadNotifs()]);renderNav();renderTab();chatStatus();setInterval(refresh,30000);
}catch(e){$('#app').innerHTML=`<div class="c">${esc(e.message)}<br><br><button class="btn sm2" style="width:auto;padding:0 24px;margin:0 auto" onclick="location.reload()">Qayta urinish</button></div>`}})();
</script></body></html>
